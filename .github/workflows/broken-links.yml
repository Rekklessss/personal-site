name: Check documentation links

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".github/workflows/broken-links.yml"]
  pull_request:
    branches: [main]
    paths: ["**/*.md", ".github/workflows/broken-links.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          fail: true
          args: --no-progress './*.md' './docs/**/*.md' './.github/**/*.md' './assets/fonts/geist-mono/README.md'
