name: Check documentation links

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".github/workflows/broken-links.yml"]
  pull_request:
    branches: [main]
    paths: ["**/*.md", ".github/workflows/broken-links.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: true
          # Preview URLs are instructions for local development, not public endpoints.
          args: --no-progress --exclude-loopback './*.md' './docs/**/*.md' './.github/**/*.md' './assets/fonts/geist-mono/README.md'
