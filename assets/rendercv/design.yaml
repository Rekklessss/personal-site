# for more options, see https://docs.rendercv.com/user_guide/yaml_input_structure/design/
design:
  theme: classic
  colors:
    name: "#166534"
    headline: "#166534"
    connections: "#166534"
    section_titles: "#166534"
    links: "#166534"
  page:
    size: a4
    top_margin: 0.4in
    bottom_margin: 0.4in
    show_footer: false
    show_top_note: false
  typography:
    line_spacing: 0.3em
    font_size:
      body: 11pt
      connections: 13pt
  header:
    space_below_name: 0.55cm
    space_below_headline: 0.3cm
    space_below_connections: 0.3cm
  section_titles:
    space_above: 0.35cm
    space_below: 0.2cm
  entries:
    degree_width: 1.35cm
    short_second_row: false
  sections:
    allow_page_break: false
    space_between_regular_entries: 0.55em
    show_time_spans_in: []
  templates:
    normal_entry:
      main_column: "**NAME**\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: "[GitHub](GITHUB)"
    experience_entry:
      main_column: "**COMPANY**\nPOSITION\nHIGHLIGHTS"
      date_and_location_column: "DATE\nLOCATION"
